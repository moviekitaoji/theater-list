<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJ 4DPLEX - 規格詳解</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="pb-24">
    <header class="header-blue-bg">
        <h1 class="text-4xl md:text-6xl font-black text-white tracking-widest mb-6 uppercase">CJ 4DPLEX</h1>
        <nav class="main-nav mb-8">
            <button class="mobile-menu-btn md:hidden" onclick="toggleMenu()">
                <i class="fas fa-bars mr-2"></i>選單導覽
            </button>
            <div id="nav-links" class="nav-links hidden md:flex">
                <a href="index.html" class="nav-btn">影廳清單</a>
                <a href="spec.html" class="nav-btn">規格指南</a>
                <a href="imax.html" class="nav-btn">IMAX 系列</a>
                <a href="dolby.html" class="nav-btn">DOLBY 系列</a>
                <a href="cj.html" class="nav-btn active">CJ 4DPLEX</a>
                <a href="media.html" class="nav-btn">MEDIA MATION</a>
                <a href="dbox.html" class="nav-btn">D-BOX</a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-10">
        <div id="cj-main-content" class="space-y-20"></div>
    </main>

    <div class="social-float">
        <a href="https://www.facebook.com/" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.threads.net/" target="_blank"><i class="fab fa-threads"></i></a>
        <div class="social-info">電影北大路<br>Movie Kitaoji</div>
    </div>

    <script src="data/cj-data.js"></script>
    <script>
        function toggleMenu() {
            const links = document.getElementById('nav-links');
            links.classList.toggle('hidden');
            links.classList.toggle('flex');
        }

        function renderCJ() {
            const mainContent = document.getElementById('cj-main-content');
            if (typeof cjSpecData === 'undefined') return;

            cjSpecData.forEach(item => {
                const cinemaHtml = item.cinemas.map(c => `
                    <div class="imax-cinema-box border-2" style="border-color: ${c.color};">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xl cinema-name-glow" style="color: ${c.color}">${c.name}</span>
                            <div class="flex items-center gap-3">
                                <span class="font-semibold text-lg" style="color: ${c.color}">${c.hall}</span>
                                ${c.ratio ? `<span class="dolby-ratio-text" style="color: ${c.color}">${c.ratio}</span>` : ''}
                                ${c.is4k ? '<span class="status-badge">4K</span>' : '<div class="w-[22px]"></div>'}
                            </div>
                        </div>
                    </div>`).join('');

                mainContent.innerHTML += `
                <div class="cj-group-wrapper space-y-8">
                    <div class="intro-card-cj-solid shadow-2xl" style="background-color: ${item.introBG}">
                        <h2 class="font-black text-3xl mb-4">${item.introTitle}</h2>
                        <p class="text-white opacity-90 leading-relaxed text-base">${item.introDesc}</p>
                    </div>
                    <div class="cj-logic-card-wrapper shadow-2xl" style="border-color: ${item.introBG}">
                        <div class="cj-logic-header" style="background-color: ${item.introBG}; border-color: ${item.introBG}">
                            <h3 class="text-xl font-bold text-white">${item.type}</h3>
                            <span class="text-sm font-bold text-white opacity-70">${item.projector}</span>
                        </div>
                        <div class="cj-logic-body">
                            <div class="flex flex-col lg:flex-row items-center logic-flex-container">
                                <div class="flex flex-[2] items-center logic-flex-container w-full">
                                    <div class="logic-block-item ${item.logic[0].class}">${item.logic[0].text}</div>
                                    <div class="imax-symbol">+</div>
                                    <div class="logic-block-item ${item.logic[1].class}">${item.logic[1].text}</div>
                                </div>
                                <div class="imax-symbol imax-equal">=</div>
                                <div class="flex-[1.2] w-full">${cinemaHtml}</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }
        window.onload = renderCJ;
    </script>
</body>

</html>
