<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA MATION - MX4D 技術詳解</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="pb-24">
    <header class="header-blue-bg">
        <h1 class="text-4xl md:text-6xl font-black text-white tracking-widest mb-6 uppercase">MEDIA MATION</h1>
        <nav class="main-nav mb-8">
            <button class="mobile-menu-btn md:hidden" onclick="toggleMenu()">
                <i class="fas fa-bars mr-2"></i>選單導覽
            </button>
            <div id="nav-links" class="nav-links hidden md:flex">
                <a href="index.html" class="nav-btn">影廳清單</a>
                <a href="spec.html" class="nav-btn">規格指南</a>
                <a href="imax.html" class="nav-btn">IMAX 系列</a>
                <a href="dolby.html" class="nav-btn">DOLBY 系列</a>
                <a href="cj.html" class="nav-btn">CJ 4DPLEX</a>
                <a href="media.html" class="nav-btn active">MEDIA MATION</a>
                <a href="dbox.html" class="nav-btn">D-BOX</a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-10">
        <div id="media-main-content" class="space-y-16"></div>
    </main>

    <div class="social-float">
        <a href="https://www.facebook.com/" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.threads.net/" target="_blank"><i class="fab fa-threads"></i></a>
        <div class="social-info">電影北大路<br>Movie Kitaoji</div>
    </div>

    <script src="data/media-data.js"></script>
    <script>
        function toggleMenu() {
            const links = document.getElementById('nav-links');
            links.classList.toggle('hidden');
            links.classList.toggle('flex');
        }

        function renderMedia() {
            const mainContent = document.getElementById('media-main-content');
            if (typeof mediaSpecData === 'undefined') return;

            mediaSpecData.forEach(cat => {
                const detailsHtml = cat.introDetails.map(d => `<div class="mb-3"><span class="text-[#ffd700] font-bold">● ${d.label}：</span><span class="text-white opacity-90">${d.items}</span></div>`).join('');

                const rowsContent = cat.rows.map(row => {
                    const cinemaHtml = row.cinemas.map(c => `
                        <div class="imax-cinema-box border-2 w-full h-full" style="border-color: ${c.color};">
                            <div class="flex justify-between items-center h-full">
                                <span class="font-bold text-xl cinema-name-glow" style="color: ${c.color}">${c.name}</span>
                                <div class="flex items-center gap-3">
                                    <span class="font-semibold text-lg" style="color: ${c.color}">${c.hall}</span>
                                    ${c.ratio ? `<span class="dolby-ratio-text" style="color: ${c.color}">${c.ratio}</span>` : ''}
                                    ${c.is4k ? '<span class="status-badge">4K</span>' : '<div class="w-[22px]"></div>'}
                                </div>
                            </div>
                        </div>`).join('');

                    const logicHtml = row.logic.map((l, index) => {
                        const isMX4DBox = l.text.includes("MX4D");
                        const customStyle = isMX4DBox ? `style="background-color: ${cat.introBG}"` : '';
                        let block = `<div class="logic-block-item ${l.class}" ${customStyle}>${l.text}</div>`;
                        if (index < row.logic.length - 1) block += `<div class="imax-symbol">+</div>`;
                        return block;
                    }).join('');

                    return `
                    <div class="flex flex-col lg:flex-row gap-4 items-center logic-flex-container mb-10 last:mb-0">
                        <div class="flex flex-[2] items-center logic-flex-container w-full">${logicHtml}</div>
                        <div class="imax-symbol imax-equal">=</div>
                        <div class="flex-[1] w-full">${cinemaHtml}</div>
                    </div>`;
                }).join('');

                mainContent.innerHTML = `
                <div class="media-group-wrapper space-y-8">
                    <div class="intro-card-cj-solid shadow-2xl" style="background-color: ${cat.introBG}">
                        <h2 class="font-black text-3xl mb-4" style="color: #ffd700">${cat.introTitle}</h2>
                        <div class="text-white text-base mb-4 font-bold">${cat.introDesc}</div>
                        <div class="text-sm leading-relaxed">${detailsHtml}</div>
                    </div>
                    <div class="cj-logic-card-wrapper shadow-2xl" style="border-color: ${cat.introBG}">
                        <div class="cj-logic-header" style="background-color: ${cat.introBG}; border-color: ${cat.introBG}">
                            <h3 class="text-xl font-bold text-white uppercase">MX4D (MediaMation 4D 體感影廳)</h3>
                        </div>
                        <div class="cj-logic-body">${rowsContent}</div>
                    </div>
                </div>`;
            });
        }
        window.onload = renderMedia;
    </script>
</body>

</html>
